limit_req_zone $binary_remote_addr zone=depth_jobs:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=depth_conn:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name @SERVER_NAME@;

    client_max_body_size 510m;
    client_body_timeout 300s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location ~ ^/api/jobs(?:/remote)?$ {
        limit_req zone=depth_jobs burst=2 nodelay;
        limit_conn depth_conn 2;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_conn depth_conn 20;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
